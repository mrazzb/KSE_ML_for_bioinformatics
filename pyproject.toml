[project]
name = "kse-bioinformatics-practicals"
version = "0.1.0"
description = "Reusable environment for the KSE bioinformatics machine-learning practicals"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dcor>=0.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xlrd>=2.0.1",
    "dcor>=0.7",
    "statsmodels>=0.14",
    "ucimlrepo>=0.0.7",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
regression-zoo = [
    "arviz>=0.22",
    "lifelines>=0.30",
    "pymc>=5.25",
    "pygam>=0.9",
    "pysr>=1.5",
]
