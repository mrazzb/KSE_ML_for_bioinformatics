[project]
name = "kse-bioinformatics-practicals"
version = "0.1.0"
description = "Reusable environment for the KSE bioinformatics machine-learning practicals"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dcor>=0.7",
    "gradio>=5.0,<7.0",
    "ipykernel>=6.29",
    "ipympl>=0.9.6",
    "jupyterlab>=4.4",
    "lightgbm>=4.7.0",
    "mlflow>=3.0,<4.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "optuna>=5.0.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "pubchempy>=1.0.5",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "seaborn>=0.13.2",
    "torch-geometric>=2.7.0",
    "transformers>=4.50",
    "accelerate>=1.0",
    "ucimlrepo>=0.0.7",
    "umap-learn>=0.5.7",
    "xgboost>=3.2.0",
    "xlrd>=2.0.1",
    "tensorflow>=2.21.0",
    "graphviz>=0.21",
    "kagglehub>=1.0.2",
    "ultralytics>=8.4.182",
    "cellpose>=4.2.1.1",
    "tifffile>=2026.3.3",
    "napari[all]>=0.9.2",
]
